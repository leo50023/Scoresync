<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Dark navy circle background -->
  <circle cx="100" cy="100" r="99" fill="#0d1f35"/>
  <circle cx="100" cy="100" r="99" fill="none" stroke="#1e4080" stroke-width="2"/>

  <!-- Bar chart — 3 bars rising left to right -->
  <rect x="32" y="88" width="28" height="58" rx="5" fill="#1a56db"/>
  <rect x="70" y="62" width="28" height="84" rx="5" fill="#2563eb"/>
  <rect x="108" y="40" width="28" height="106" rx="5" fill="#3b82f6"/>

  <!-- White arrow swoosh over bars -->
  <path d="M36 85 Q70 50 110 38 L148 28" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <!-- Arrow head -->
  <polyline points="134,20 148,28 140,42" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- SCORESYNC text at bottom -->
  <text x="100" y="172" text-anchor="middle"
    font-family="Arial Black,Arial,sans-serif"
    font-size="18" font-weight="900"
    letter-spacing="4"
    fill="white" opacity="0.95">SCORESYNC</text>
</svg>
